name: Java CI - LSDFMS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Concurrency Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compilar codigo Java nativo
      run: |
        mkdir -p bin data
        find src/main/java -name "*.java" > sources.txt
        javac -d bin -sourcepath src/main/java @sources.txt
        rm -f sources.txt

    - name: Ejecutar Test de Concurrencia de la Cola (Brandon)
      run: |
        java -cp bin pe.edu.unmsm.lsdfms.queue.QueueConcurrencyTest
